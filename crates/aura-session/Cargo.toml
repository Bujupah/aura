[package]
name = "aura-session"
description = "A listening session: two audio sources, two realtime sessions, one merged stream of speaker turns."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aura-audio = { path = "../aura-audio" }
aura-core = { path = "../aura-core" }
aura-intel = { path = "../aura-intel" }
aura-live = { path = "../aura-live" }
aura-translate = { path = "../aura-translate" }
serde.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
dotenvy = "0.15"
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
