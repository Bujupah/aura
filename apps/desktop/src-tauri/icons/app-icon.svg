<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Aura">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d22"/>
      <stop offset="1" stop-color="#0f0f12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- The tile carries its own background so the mark reads on light and dark pages. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="101.500" y="101.500" width="821" height="821" rx="184.500" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <circle cx="512" cy="512" r="330" fill="url(#glow)"/>
  <!-- Three rings: listening outward from one quiet point. -->
  <circle cx="512" cy="512" r="286" fill="none" stroke="#6ee7b7" stroke-opacity="0.22" stroke-width="20"/>
  <circle cx="512" cy="512" r="208" fill="none" stroke="#6ee7b7" stroke-opacity="0.50" stroke-width="24"/>
  <circle cx="512" cy="512" r="128" fill="none" stroke="#f4f4f5" stroke-width="30"/>
  <circle cx="512" cy="512" r="50" fill="#6ee7b7"/>
</svg>
