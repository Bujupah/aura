[workspace]
resolver = "2"
members = ["crates/aura-core", "crates/aura-live", "crates/aura-translate", "crates/aura-audio", "crates/aura-storage", "crates/aura-intel", "crates/aura-session", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
